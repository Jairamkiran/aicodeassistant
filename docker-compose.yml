# =============================================================================
# AI Software Engineering Assistant — local development & demo stack.
#
# `docker compose up -d`                  → infrastructure + observability only
#                                           (run app/worker from your IDE).
# `docker compose --profile apps up -d`   → also build & run app + indexer-worker.
#
# Every service has a healthcheck; dependent services wait for health so the
# stack comes up in a correct order. Data is persisted in named volumes.
# =============================================================================
name: aicodeassistant

services:
  # --------------------------------------------------------------------------
  # Persistence
  # --------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aicodeassistant
      POSTGRES_USER: aicodeassistant
      POSTGRES_PASSWORD: aicodeassistant
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicodeassistant -d aicodeassistant"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [aicodeassistant]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [aicodeassistant]

  # --------------------------------------------------------------------------
  # Messaging — Kafka in KRaft mode (no Zookeeper)
  # --------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: aicodeassistant-kraft-cluster-0001
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [aicodeassistant]

  # --------------------------------------------------------------------------
  # Local LLM + embeddings — Ollama (default AI provider)
  # --------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.3.14
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama --version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [aicodeassistant]

  # One-shot: pulls the default chat + embedding models after ollama is up.
  ollama-init:
    image: ollama/ollama:0.3.14
    depends_on:
      ollama: { condition: service_healthy }
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama pull llama3.1 && ollama pull nomic-embed-text"
    restart: "no"
    networks: [aicodeassistant]

  # --------------------------------------------------------------------------
  # Observability — metrics, dashboards, logs, traces
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "9090:9090"
    volumes:
      - ./docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [aicodeassistant]

  loki:
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./docker/observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks: [aicodeassistant]

  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo/tempo-config.yml"]
    ports:
      - "3200:3200"     # tempo query
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    volumes:
      - ./docker/observability/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo-data:/var/tempo
    networks: [aicodeassistant]

  grafana:
    image: grafana/grafana:11.2.2
    depends_on:
      - prometheus
      - loki
      - tempo
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [aicodeassistant]

  # --------------------------------------------------------------------------
  # Application deployables (optional — enable with `--profile apps`)
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    profiles: ["apps"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      AICODEASSISTANT_DB_URL: jdbc:postgresql://postgres:5432/aicodeassistant
      AICODEASSISTANT_KAFKA_BOOTSTRAP: kafka:9092
      AICODEASSISTANT_REDIS_HOST: redis
      AICODEASSISTANT_OLLAMA_URL: http://ollama:11434
      AICODEASSISTANT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    ports:
      - "8080:8080"
    networks: [aicodeassistant]

  indexer-worker:
    build:
      context: .
      dockerfile: indexer-worker/Dockerfile
    profiles: ["apps"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      AICODEASSISTANT_DB_URL: jdbc:postgresql://postgres:5432/aicodeassistant
      AICODEASSISTANT_KAFKA_BOOTSTRAP: kafka:9092
      AICODEASSISTANT_OLLAMA_URL: http://ollama:11434
      AICODEASSISTANT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    ports:
      - "8081:8081"
    networks: [aicodeassistant]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    profiles: ["apps"]
    depends_on:
      app: { condition: service_started }
    ports:
      - "3001:8080"
    networks: [aicodeassistant]

networks:
  aicodeassistant:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  ollama-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
