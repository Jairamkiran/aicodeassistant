apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer-worker
  namespace: aicodeassistant
  labels:
    app.kubernetes.io/name: indexer-worker
    app.kubernetes.io/part-of: aicodeassistant
spec:
  # The atomic status-claim (ADR-0009) makes the worker safe to scale out.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: indexer-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: indexer-worker
        app.kubernetes.io/part-of: aicodeassistant
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8081"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: indexer-worker
          image: ghcr.io/jairamkiran/aicodeassistant-indexer-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: aicodeassistant-config
          env:
            - name: AICODEASSISTANT_DB_USER
              valueFrom:
                secretKeyRef: { name: aicodeassistant-secrets, key: AICODEASSISTANT_DB_USER }
            - name: AICODEASSISTANT_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: aicodeassistant-secrets, key: AICODEASSISTANT_DB_PASSWORD }
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              memory: "1536Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
