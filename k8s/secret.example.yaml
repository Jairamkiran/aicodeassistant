# TEMPLATE ONLY — do not commit real secrets. Copy to secret.yaml, fill in
# real values (or generate via `kubectl create secret generic ...`), and apply
# separately. The deployments reference these keys via secretKeyRef.
apiVersion: v1
kind: Secret
metadata:
  name: aicodeassistant-secrets
  namespace: aicodeassistant
  labels:
    app.kubernetes.io/part-of: aicodeassistant
type: Opaque
stringData:
  AICODEASSISTANT_DB_USER: "aicodeassistant"
  AICODEASSISTANT_DB_PASSWORD: "CHANGE_ME"
  # >= 32 bytes for HS256.
  AICODEASSISTANT_JWT_SECRET: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET_32B+"
  # Base64-encoded 256-bit AES key.
  AICODEASSISTANT_CRYPTO_KEY: "CHANGE_ME_BASE64_32_BYTE_KEY"
  AICODEASSISTANT_GITHUB_CLIENT_ID: ""
  AICODEASSISTANT_GITHUB_CLIENT_SECRET: ""
