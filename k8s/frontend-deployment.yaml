apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: aicodeassistant
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: aicodeassistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: aicodeassistant
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx unprivileged user
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/jairamkiran/aicodeassistant-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: aicodeassistant
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: aicodeassistant
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
