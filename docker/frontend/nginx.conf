# nginx config for the AI Software Engineering Assistant SPA.
#
# - Serves the built static assets with SPA history-fallback (any unknown path
#   returns index.html so client-side routing works on refresh/deep-link).
# - Proxies /api to the app service so the browser sees one origin (cookies +
#   no CORS). APP_UPSTREAM defaults to the compose/k8s service name.
# - Listens on 8080 so the container can run as a non-root user.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache fingerprinted assets; never cache the HTML shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Reverse-proxy the API to the backend app.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE streaming (chat): disable buffering + keep the connection open.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Baseline security headers for the static app.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
