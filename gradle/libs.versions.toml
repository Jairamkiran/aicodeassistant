# =============================================================================
# Version Catalog — single source of truth for dependency versions.
#
# Leaf modules reference these via `libs.xxx`. Versions for anything covered by
# the Spring Boot / Spring Modulith / Testcontainers / Resilience4j BOMs are
# intentionally omitted from the individual libraries below and are instead
# governed by the platform() BOM imports in buildSrc convention plugins, so we
# never hand-pin a version the BOM already aligns. Only libraries NOT managed by
# a BOM carry an explicit version here.
# =============================================================================

[versions]
# --- Platform / framework (Spring Boot 3 line, per project spec) ---
springBoot = "3.5.16"
springModulith = "1.4.12"
springDependencyMgmt = "1.1.7"

# --- Build tooling / plugins ---
spotless = "6.25.0"
checkstyle = "10.20.1"
pmd = "7.7.0"

# --- Libraries not governed by the Spring Boot BOM ---
springdoc = "3.1.0"
resilience4j = "2.4.0"
jgit = "7.3.0.202506031305-r"

# --- Test-only, not in BOM ---
archunit = "1.3.0"
wiremock = "3.13.2"

[libraries]
# BOMs (imported via platform() in convention plugins) --------------------------
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "springModulith" }
resilience4j-bom = { module = "io.github.resilience4j:resilience4j-bom", version.ref = "resilience4j" }

# Spring Boot starters (versions from BOM) -------------------------------------
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-aop = { module = "org.springframework.boot:spring-boot-starter-aop" }
spring-boot-starter-json = { module = "org.springframework.boot:spring-boot-starter-json" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }

# Messaging / data (versions from BOM) -----------------------------------------
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }

# Caching (versions from BOM) --------------------------------------------------
spring-boot-starter-cache = { module = "org.springframework.boot:spring-boot-starter-cache" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine" }

# Spring Modulith (versions from modulith BOM) ---------------------------------
spring-modulith-starter-core = { module = "org.springframework.modulith:spring-modulith-starter-core" }
spring-modulith-starter-jpa = { module = "org.springframework.modulith:spring-modulith-starter-jpa" }
spring-modulith-events-api = { module = "org.springframework.modulith:spring-modulith-events-api" }
spring-modulith-events-kafka = { module = "org.springframework.modulith:spring-modulith-events-kafka" }
spring-modulith-events-jpa = { module = "org.springframework.modulith:spring-modulith-events-jpa" }
spring-modulith-actuator = { module = "org.springframework.modulith:spring-modulith-actuator" }
spring-modulith-observability = { module = "org.springframework.modulith:spring-modulith-observability" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }
spring-modulith-docs = { module = "org.springframework.modulith:spring-modulith-docs" }

# Observability (versions from BOM) --------------------------------------------
micrometer-core = { module = "io.micrometer:micrometer-core" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version = "8.0" }

# Persistence / migration (versions from BOM) ----------------------------------
postgresql = { module = "org.postgresql:postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
h2 = { module = "com.h2database:h2" }

# API docs ---------------------------------------------------------------------
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# Resilience -------------------------------------------------------------------
resilience4j-spring-boot3 = { module = "io.github.resilience4j:resilience4j-spring-boot3" }

# Testing (versions from BOM unless noted) -------------------------------------
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-kafka = { module = "org.testcontainers:kafka" }
awaitility = { module = "org.awaitility:awaitility" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
wiremock = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker" }
resilience4j-retry = { module = "io.github.resilience4j:resilience4j-retry" }
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "jgit" }
assertj = { module = "org.assertj:assertj-core" }

# Gradle plugin *marker* artifacts — depended on by buildSrc convention plugins
# so they can `apply(plugin = "...")` by id. (A precompiled script plugin cannot
# use the [plugins] block of the catalog directly; it needs the marker artifact
# on its classpath.)
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "springBoot" }
spring-dependency-management-gradle-plugin = { module = "io.spring.dependency-management:io.spring.dependency-management.gradle.plugin", version.ref = "springDependencyMgmt" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyMgmt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
