name: Bug report
description: Report a defect so we can fix it
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill out the sections
        below. For security vulnerabilities, do NOT use this form — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I ..., I expected ..., but instead ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal, deterministic steps.
      placeholder: |
        1. ./gradlew ...
        2. docker compose up -d
        3. ...
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Affected module / area
      placeholder: "e.g. platform-web, indexer-worker, docker-compose"
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, JDK version, Docker version, and how you ran it.
      placeholder: |
        - OS:
        - JDK: (java -version)
        - Docker: (docker --version)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Include the correlationId from the error response if you have it.
      render: shell
    validations:
      required: false
