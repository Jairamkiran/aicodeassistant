name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Unit build: compile + unit tests + style (Spotless/Checkstyle). No Docker.
  # This is the fast gate that mirrors what runs on a developer machine.
  # ---------------------------------------------------------------------------
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, unit test, verify style & modularity
        run: ./gradlew clean check --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/test"
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Frontend: install, lint, unit-test, and production-build the React SPA.
  # Runs in parallel with the backend build (independent toolchain).
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Integration tests: run the Testcontainers suite. GitHub-hosted runners
  # ship with a Docker daemon, so this is where the Postgres+Kafka smoke IT
  # actually executes (the DoD item deferred on the Docker-less dev machine).
  # ---------------------------------------------------------------------------
  integration-test:
    name: Integration Test (Testcontainers)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run integration tests
        run: ./gradlew integrationTest --no-daemon --stacktrace

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: "**/build/reports/tests/integrationTest"
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Container images: verify all three images build. Not pushed here (tag/push
  # to a registry is an operator step, see docs/DEPLOYMENT.md); this job just
  # guards that the Dockerfiles stay buildable.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Build Container Images
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: false
          tags: aicodeassistant/app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build indexer-worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: indexer-worker/Dockerfile
          push: false
          tags: aicodeassistant/indexer-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: aicodeassistant/frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
